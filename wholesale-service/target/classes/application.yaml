server:
  port: 8082

api:
  base:
    path: /api/v1

spring:
  application:
    name: wholesale-service

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 36000000

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  internal-secret: ${APP_INTERNAL_SECRET}
  auth:
    url: ${AUTH_URL}
  integration:
    url: ${INTEGRATION_URL}
  shopify:
    webhook-secret: ${SHOPIFY_WEBHOOK_SECRET:}
    wholesale-approved-tag: ${SHOPIFY_WHOLESALE_APPROVED_TAG:WHOLESALE_APPROVED}
    wholesale-can-order-tag: ${SHOPIFY_WHOLESALE_CAN_ORDER_TAG:WHOLESALE_CAN_ORDER}
    wholesale-suspended-tag: ${SHOPIFY_WHOLESALE_SUSPENDED_TAG:WHOLESALE_SUSPENDED}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
